# === Shops ===
# Ein Eintrag pro Standort. Hier steht nur, was vom Grundsatz unten abweicht.
# Jeder Shop bekommt einen eigenen Telegram-Chat, siehe telegram.chat_map.
shops:
  rheinland:
    aliases: ["rhein", "rl"]       # Kurznamen fuer die Telegram-Nachricht
    brand:
      shop_name: "Engel & Völkers im Rheinland"
      handle: "@engelvoelkers.rheinland"
    metricool:
      blog_id: "5661514"           # blogId aus der Metricool-Adresszeile
  niederrhein:
    aliases: ["nr", "nrh"]
    brand:
      shop_name: "Engel & Völkers Niederrhein"
      handle: "@engelvoelkers.niederrhein"
    metricool:
      blog_id: "5738428"           # blogId des Niederrhein-Accounts
    # Abweichungen moeglich, z.B. andere Uhrzeiten:
    # schedule:
    #   times: ["10:00"]
  ruhrgebiet:
    aliases: ["rg", "ruhr"]
    brand:
      shop_name: "Engel & Völkers Ruhrgebiet"
      handle: "@engelvoelkers.ruhrgebiet"
    metricool:
      blog_id: "5771722"           # blogId des Ruhrgebiet-Accounts

  # --- Heuser Immobilien: eigenes Layout, Slider aus Briefings statt Exposes ---
  heuser:
    aliases: ["heu", "hi"]
    brand:
      shop_name: "Heuser Immobilien"
      handle: "@___"               # FEHLT NOCH - bestimmt auch den Ausgabeordner
    metricool:
      blog_id: "5668636"
    # false = Slides werden nur gebaut und zur Ansicht geschickt, nichts
    # eingeplant. Erst auf true stellen, wenn Design und Text abgestimmt sind.
    veroeffentlichen: false
    caption:
      hashtags: ["#bonn", "#immobilienbonn", "#heuserimmobilien"]
      cta_template: 'Kommentieren Sie "{keyword}" und wir melden uns bei Ihnen.'
    fonts:                         # feine Serif + schlanke Sans
      head_regular: "assets/fonts/heuser/CormorantGaramond-Variable.ttf"
      head_bold:    "assets/fonts/heuser/CormorantGaramond-Variable.ttf"
      text_regular: "assets/fonts/heuser/Jost-Variable.ttf"
      text_light:   "assets/fonts/heuser/Jost-Variable.ttf"
      text_bold:    "assets/fonts/heuser/Jost-Variable.ttf"
    slides:
      layout: "heuser"             # waehlt HeuserRenderer statt Renderer
      palette:                     # aus den Referenz-Slides gemessen
        bg: "#F5F0E8"
        accent: "#90806D"
        headline: "#2B2721"
        body: "#3D3933"
        rule: "#A89A8A"
        on_photo: "#FFFFFF"
      bild:
        provider: "higgsfield"
        model: "higgsfield-ai/soul/standard"
        resolution: "720p"         # hoehere Werte erst testen, bevor sie hier stehen
        aspect_cover: "3:4"        # Cover und CTA sind vollflaechig hochkant
        aspect_content: "4:3"      # Inhaltsslides zeigen nur ein breites Band
        timeout_s: 240             # Wartezeit je Bild
        cache: "out/_bilder"
        stil: ""                   # leer = Vorgabe aus bilder.py

# Gilt nur noch, wenn genau EIN Shop konfiguriert ist. Bei mehreren Shops
# ist das Kuerzel in der Nachricht Pflicht (siehe shop_pflicht).
default_shop: "rheinland"

# true = bei mehreren Shops muss jede Nachricht ein Kuerzel tragen. Fehlt es,
# fragt der Bot nach, statt still auf default_shop auszuweichen.
shop_pflicht: true

telegram:
  # Nur noetig, wenn verschiedene Personen aus eigenen Chats posten.
  # Bei einem Chat fuer alles: leer lassen und den Shop in der Nachricht nennen.
  chat_map: {}

# === Grundeinstellungen (gelten fuer alle Shops) ===
brand:
  red: "#C8102E"          # E&V Rot – im Brand Manual gegenprüfen
  shop_name: "Engel & Völkers im Rheinland"
  handle: "@engelvoelkers.rheinland"

fonts:
  head_regular: "assets/fonts/EngelVoelkersHead_Rg.ttf"   # Serif: Headlines, Zahlenwerte
  head_bold:    "assets/fonts/EngelVoelkersHead_Bd.ttf"
  text_regular: "assets/fonts/EngelVoelkersText_Rg.ttf"   # Sans: Labels, Bildtitel
  text_light:   "assets/fonts/EngelVoelkersText_Lt.ttf"
  text_bold:    "assets/fonts/EngelVoelkersText_Bd.ttf"

# Gilt fuer alle Shops ohne eigene Angabe. "ev" = das bestehende E&V-Layout.
slides:
  layout: "ev"
  width: 1080
  height: 1350            # 4:5
  max_total: 10           # Instagram-Maximum: Titel + Fakten + bis zu 8 Fotoseiten
  # Ein Eintrag darf Alternativen enthalten: "Grundstück|Baujahr" nimmt die
  # Grundstücksfläche, wenn es eine gibt (Häuser), sonst das Baujahr (Wohnungen).
  facts: ["Wohnfläche", "Badezimmer", "Grundstück|Baujahr", "Zimmer"]
  fact_icon: "haken"      # "haken" = ueberall ein Haken | "auto" = eigene Symbole

caption:
  model: "claude-sonnet-5"
  max_chars: 1400
  keyword_umlaute: true   # CTA-Stichwort mit Umlaut ("RARITÄT").
                          # false schreibt es um ("RARITAET").
  cta_template: 'Kommentieren Sie "{keyword}" und Sie erhalten das komplette Exposé per DM.'

slides_facts_hint: |
  Reihenfolge der Fakten auf Slide 2 (max. 4). Icons optional als
  assets/icons/<key>.png, z.B. wohnflaeche.png, badezimmer.png

schedule:
  days: ["monday","tuesday","wednesday","thursday","friday","saturday"]
  times: ["09:30", "11:30"]   # morgens - abends laufen die Reels
  timezone: "Europe/Berlin"
  min_lead_hours: 12          # kein Post innerhalb der nächsten 12 h

  # --- Belegte Termine ueberspringen (evslider/belegung.py) ---
  # Vor dem Einplanen wird bei Metricool nachgefragt, was im Kalender dieses
  # Shops schon steht. Ist der Wunschtermin belegt, rutscht der Post auf den
  # naechsten erlaubten Tag zur selben Uhrzeit.
  slot_check: true            # false = Pruefung aus, alter Stand
  slot_toleranz_min: 60       # ein vorhandener Post ±60 Min gilt als Kollision
  tag_komplett: false         # true = nur EIN Post pro Tag, egal zu welcher
                              # Uhrzeit. Blockiert dann auch Tage, an denen
                              # nur ein Reel liegt - deshalb hier false.
  max_vorlauf_tage: 21        # rutscht der Termin weiter weg, warnt das
                              # Protokoll deutlich

metricool:
  auto_publish: true
  networks: ["instagram", "facebook", "linkedin"]
  normalize_media: true   # Bilder vor dem Einplanen auf Metricools Server kopieren
  base_url: "https://app.metricool.com/api"

hosting:
  # github = kostenlos, keine Kreditkarte, kein Server noetig
  mode: "github"
  # In GitHub Actions bleiben beide leer - das Repo wird automatisch erkannt.
  # Nur ausfuellen, wenn das Tool woanders laeuft (z.B. lokal auf dem Mac).
  github_owner: ""
  github_repo: ""
  github_branch: "main"
  prefix: ""
  # nur fuer mode: s3
  bucket: ""
  endpoint_url: ""
  public_base_url: ""

output_dir: "out"
